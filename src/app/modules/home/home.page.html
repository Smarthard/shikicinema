<ion-content
    [fullscreen]="true"
    class="page-content ion-no-padding"
    appWithFooter
>
    @defer(when isMobile && isFiltersOpen()) {
        <ion-modal
            [isOpen]="isFiltersOpen()"
            [breakpoints]="[0, 0.65, 0.8]"
            [initialBreakpoint]="0.65"
            (didDismiss)="onFiltersModalClose()"
        >
            <ng-template>
                <app-anime-filter-panel
                    [filters]="filters()"
                    (filterChange)="onFiltersChange($event)"
                />
            </ng-template>
        </ion-modal>
    }

    @if (isFiltersOpen() && !isMobile) {
        <app-anime-filter-panel
            class="home-page__filters"
            [filters]="filters()"
            (filterChange)="onFiltersChange($event)"
        />
    }

    <div
        class="home-page__content"
        [class.home-page__content--with-filters]="isFiltersOpen() && !isMobile"
    >
        @for (status of animeStatusOrder(); track status; let index = $index) {
            @let hasPriority = index <= 1;
            @let isLoading = isSectionLoading(status);
            @let size = sectionSize(status);

            <app-anime-rate-section
                class="home-page__anime-rates"
                [rates]="userRatesBySection(status) | async"
                [label]="'HOME_MODULE.HOME_PAGE.GRIDS.' + (status | uppercase)"
                [status]="status"
                [isLoading]="isFirstLoading() && isLoading()"
                [size]="size()"
                [isHidden]="getHiddenGridStatus(status)"
                [hasPriority]="hasPriority"
                (toggleHidden)="toggleHiddenGridStatus(status)"
            />
        }
    </div>
</ion-content>
